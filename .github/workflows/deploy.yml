name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-version: ${{ steps.meta.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create data directories
        run: |
          mkdir -p ./noton-data/uploads
          mkdir -p ./mysql-data
          chmod -R 755 ./noton-data
          chmod -R 755 ./mysql-data

      - name: Update docker-compose with new image
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          FIRST_TAG=$(echo "$IMAGE_TAG" | head -n1)
          sed -i "s|image:.*|image: $FIRST_TAG|g" docker-compose.yaml

      - name: Pull latest images
        run: |
          docker compose pull

      - name: Stop and remove old containers
        run: |
          docker compose down

      - name: Start containers
        run: |
          docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 10
          docker compose ps

      - name: Run migrations
        run: |
          docker compose exec -T accounting_manager php artisan migrate --force

      - name: Clear cache
        run: |
          docker compose exec -T accounting_manager php artisan config:cache
          docker compose exec -T accounting_manager php artisan route:cache
          docker compose exec -T accounting_manager php artisan view:cache

      - name: Check container health
        run: |
          if [ $(docker compose ps -q accounting_manager | wc -l) -eq 0 ]; then
            echo "Container is not running!"
            docker compose logs accounting_manager
            exit 1
          fi
          echo "Deployment successful!"

      - name: Cleanup old images
        run: |
          docker image prune -af --filter "until=72h"

  notify:
    name: Notify Deployment Status
    runs-on: self-hosted
    needs: [build-and-push, deploy]
    if: always()
    
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
